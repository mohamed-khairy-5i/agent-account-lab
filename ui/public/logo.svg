<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-personal" x1="8" y1="8" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <linearGradient id="grad-work" x1="28" y1="28" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>

    <linearGradient id="grad-core" x1="24" y1="24" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000" floodOpacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Frame Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#121215" stroke="#27272a" stroke-width="1.5" />

  <!-- Personal Account Ring (Cyan) -->
  <circle cx="26" cy="26" r="13" stroke="url(#grad-personal)" stroke-width="2.75" stroke-dasharray="4 2" opacity="0.9" />
  <circle cx="26" cy="22" r="3.5" fill="#38bdf8" />
  <path d="M19 32C19 28.5 22 27 26 27C30 27 33 28.5 33 32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Work Account Ring (Indigo) -->
  <circle cx="38" cy="38" r="13" stroke="url(#grad-work)" stroke-width="2.75" opacity="0.95" />
  <circle cx="38" cy="34" r="3.5" fill="#818cf8" />
  <path d="M31 44C31 40.5 34 39 38 39C42 39 45 40.5 45 44" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />

  <!-- Precision Disambiguation Prism -->
  <g filter="url(#subtle-shadow)">
    <path d="M32 16V21M32 43V48M16 32H21M43 32H48" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <polygon points="32,25 39,32 32,39 25,32" fill="url(#grad-core)" stroke="#6ee7b7" stroke-width="1.5" />
    <circle cx="32" cy="32" r="2.4" fill="#ffffff" />
  </g>
</svg>
